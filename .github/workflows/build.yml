name: Build FilmCraft AppImage for Ubuntu 20.04

# Builds the upstream FilmCraft (https://github.com/storytold/filmcraft) inside an
# ubuntu:20.04 container so every produced ELF only needs GLIBC <= 2.31, then
# packages it as an AppImage and publishes a pre-release.
#
# GitHub-hosted ubuntu-20.04 runners were retired in March 2025, so we run on
# ubuntu-22.04 with container: ubuntu:20.04. The build, link and package steps
# all execute inside the container; the JavaScript release/upload actions run on
# the host runner and share the workspace mount.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Upstream tag or branch to build (e.g. v0.6.0, main, or "latest")'
        required: false
        default: 'latest'
  push:
    branches: [main]

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  APPIMAGE_EXTRACT_AND_RUN: '1'
  # The upstream release profile sets codegen-units = 1 which is very memory-hungry
  # on a 47-crate workspace. Override to 16 so we don't OOM the 7 GB runner.
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04
    steps:
      # ---- 1. System dependencies -----------------------------------------------------------
      # git, curl, ca-certificates MUST come first (actions inside containers need them,
      # and rustup needs curl+CA certs).
      - name: Install system dependencies
        run: |
          set -eux
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            ca-certificates curl wget git \
            libssl-dev libasound2-dev libvulkan-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcb1-dev libxrandr-dev libxi-dev libxcursor-dev \
            libgtk-3-dev libglib2.0-dev libdbus-1-dev \
            libgl1-mesa-dev libfuse2 \
            cmake file binutils \
            desktop-file-utils squashfs-tools xz-utils \
            python3 zsync appstream
          # gcc-10 as a fallback if any C++ dep needs a newer standard than gcc-9
          apt-get install -y --no-install-recommends gcc-10 g++-10 || true
          git --version
          curl --version | head -1

      # ---- 2. Rust toolchain ----------------------------------------------------------------
      - name: Install Rust stable (>= 1.95)
        run: |
          set -eux
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain stable --profile minimal
          . "$HOME/.cargo/env"
          rustc --version
          cargo --version
          # Hard gate: workspace requires >= 1.95
          rustc --version | awk '{
            split($2, v, ".")
            major = v[1]+0; minor = v[2]+0
            if (major < 1 || (major == 1 && minor < 95)) {
              printf "ERROR: rustc %s < 1.95\n", $2 > "/dev/stderr"; exit 1
            }
          }'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # ---- 3. Resolve upstream ref ----------------------------------------------------------
      - name: Resolve upstream ref
        id: ref
        run: |
          set -eux
          REF="${{ inputs.ref || 'latest' }}"
          if [ "$REF" = "latest" ]; then
            REF=$(git ls-remote --tags https://github.com/storytold/filmcraft.git \
                  | awk -F/ '{print $3}' | sed 's/\^{}$//' | sort -V | tail -1)
          fi
          echo "Upstream ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"

      # ---- 4. Clone upstream ----------------------------------------------------------------
      - name: Clone upstream source
        run: |
          set -eux
          git clone --depth 1 --branch "${{ steps.ref.outputs.ref }}" \
            https://github.com/storytold/filmcraft.git src
          cd src
          git log -1 --oneline

      # ---- 5. Read version from Cargo.toml --------------------------------------------------
      - name: Read version
        id: ver
        run: |
          set -eux
          VERSION=$(awk '
            /^\[/ { in_pkg = ($0 == "[workspace.package]"); next }
            in_pkg && $1 == "version" { gsub(/[" ]/, "", $3); print $3; exit }
          ' src/Cargo.toml)
          echo "Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ---- 6. Build + package ---------------------------------------------------------------
      - name: Build and package AppImage
        run: |
          set -eux
          . "$HOME/.cargo/env"
          cd src
          # package.sh does: cargo build --release --locked -p filmcraft -p filmcraft-cli
          # then stages an AppDir and calls appimagetool.
          packaging/linux/package.sh --formats "appimage"
          ls -lh dist/release/

      # ---- 7. Rename + SHA256 ---------------------------------------------------------------
      - name: Rename AppImage and create SHA256SUMS
        id: pkg
        run: |
          set -eux
          VERSION="${{ steps.ver.outputs.version }}"
          SRC="src/dist/release/filmcraft-${VERSION}-linux-x86_64.AppImage"
          DST="FilmCraft-${VERSION}-ubuntu20.04-x86_64.AppImage"
          test -f "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" > SHA256SUMS
          echo "appimage=$DST" >> "$GITHUB_OUTPUT"
          ls -lh "$DST" SHA256SUMS
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS

      # ---- 8. VERIFY: GLIBC <= 2.31 ---------------------------------------------------------
      - name: Verify GLIBC requirement (must be <= 2.31)
        run: |
          set -eux
          APPIMAGE="${{ steps.pkg.outputs.appimage }}"
          chmod +x "$APPIMAGE"
          # Extract the AppImage so we can inspect every bundled ELF
          ./"$APPIMAGE" --appimage-extract >/dev/null 2>&1 || true
          test -d squashfs-root
          echo "=== All GLIBC / GLIBCXX symbols required by bundled ELF files ==="
          for f in $(find squashfs-root -type f); do
            file "$f" | grep -q ELF &&
              objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC(XX)?_[0-9.]*' || true
          done | sort -uV
          echo "=== Highest GLIBC ==="
          MAX_GLIBC=$(for f in $(find squashfs-root -type f); do
            file "$f" | grep -q ELF &&
              objdump -T "$f" 2>/dev/null | grep -oE 'GLIBC_[0-9.]*' || true
          done | sort -uV | tail -1)
          echo "$MAX_GLIBC"
          MAX_VER=$(echo "$MAX_GLIBC" | sed 's/GLIBC_//')
          test -n "$MAX_VER"
          echo "$MAX_VER" | awk '{
            if ($1+0 > 2.31) { printf "FAIL: GLIBC %s > 2.31\n", $1 > "/dev/stderr"; exit 1 }
            else             { printf "PASS: GLIBC %s <= 2.31\n", $1 }
          }'

      # ---- 9. VERIFY: ldd -------------------------------------------------------------------
      - name: Verify ldd (no missing libraries)
        run: |
          set -eux
          echo "=== ldd of main GUI binary ==="
          ldd squashfs-root/usr/bin/filmcraft || true
          echo "=== ldd of CLI binary ==="
          ldd squashfs-root/usr/bin/filmcraft-cli || true
          echo "=== 'not found' check ==="
          # libvulkan.so.1 etc. are dlopen'd by some code paths; list them so we
          # can distinguish expected-missing from real-missing.
          NOT_FOUND=$(ldd squashfs-root/usr/bin/filmcraft 2>&1 | grep 'not found' || true)
          if [ -n "$NOT_FOUND" ]; then
            echo "WARNING: 'not found' lines in ldd:"
            echo "$NOT_FOUND"
            echo "(These may be OK if they are libraries the app dlopen()s at runtime,"
            echo " e.g. Vulkan ICDs. If they are libraries the app links directly, this"
            echo " is a real problem.)"
          else
            echo "OK: no 'not found' lines"
          fi

      # ---- 10. VERIFY: CLI smoke test -------------------------------------------------------
      - name: Smoke test (CLI --version)
        run: |
          set -eux
          chmod +x squashfs-root/usr/bin/filmcraft-cli
          squashfs-root/usr/bin/filmcraft-cli --version
          echo "CLI exit code: $?"

      # ---- 11. Upload artifact --------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-ubuntu20.04-x86_64
          path: |
            ${{ steps.pkg.outputs.appimage }}
            SHA256SUMS
          if-no-files-found: error

      # ---- 12. Create GitHub Release --------------------------------------------------------
      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}-ubuntu20.04
          name: FilmCraft ${{ steps.ver.outputs.version }} (Ubuntu 20.04)
          prerelease: true
          make_latest: 'false'
          files: |
            ${{ steps.pkg.outputs.appimage }}
            SHA256SUMS
          body: |
            FilmCraft AppImage built for **Ubuntu 20.04 LTS (glibc 2.31)**.

            | | |
            |---|---|
            | Upstream | https://github.com/storytold/filmcraft |
            | Upstream ref | `${{ steps.ref.outputs.ref }}` |
            | Version | `${{ steps.ver.outputs.version }}` |
            | Build env | `ubuntu:20.04` container on `ubuntu-22.04` runner |
            | Max GLIBC | ≤ 2.31 (verified in workflow) |

            ## Install on Ubuntu 20.04

            ```bash
            chmod +x FilmCraft-${{ steps.ver.outputs.version }}-ubuntu20.04-x86_64.AppImage
            ./FilmCraft-${{ steps.ver.outputs.version }}-ubuntu20.04-x86_64.AppImage
            ```

            ### GPU requirement
            FilmCraft uses wgpu (Vulkan on Linux). Ubuntu 20.04 needs a Vulkan driver:
            ```bash
            sudo apt install mesa-vulkan-drivers   # Intel / AMD
            # OR install the proprietary NVIDIA driver
            ```
